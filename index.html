<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game House</title>
<style>
:root{--bg:#f8faff;--text:#202124;--muted:#687078;--line:#e4e8ee;--blue:#1a73e8;--blue-soft:#e8f0fe}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 50% -20%,#e8f0fe,transparent 48%),var(--bg)}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:9px 13px;background:#fff;color:var(--muted)}button:hover{background:var(--blue-soft);color:var(--blue)}.app{min-height:100vh;display:flex;flex-direction:column}header{height:72px;background:#ffffffdd;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,72px)}.brand{border:0;background:transparent;font-size:20px;font-weight:700;padding:0}.logo{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#4285f4,#8ab4f8);color:#fff;margin-right:10px}.sound{border-radius:999px}.view-hidden{display:none!important}main{width:min(1120px,calc(100% - 40px));margin:auto;flex:1;padding:58px 0 72px}.hero{text-align:center;max-width:700px;margin:0 auto 48px}.eyebrow{color:var(--blue);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.hero h1{font-size:clamp(44px,7vw,72px);margin:14px 0 0;letter-spacing:-.06em}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:13px;box-shadow:0 12px 35px #4285f412}.card h2{margin:18px 8px 7px}.card p{margin:0 8px 20px;color:var(--muted);line-height:1.5;min-height:48px}.art{height:170px;border-radius:15px;display:grid;place-items:center}.pong{background:linear-gradient(135deg,#dbeafe,#eef2ff)}.snake{background:linear-gradient(135deg,#dcfce7,#ecfdf5)}.chess{background:linear-gradient(135deg,#fef3c7,#fff7ed)}.art-icon{font-size:67px}.play{width:100%;border:0;background:var(--blue);color:#fff;font-weight:700}.play:hover{background:#155fc7;color:#fff}.game-wrap{max-width:760px}.game-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.game-title{text-align:center}.game-title h1{font-size:22px;margin:0}.game-title span{font-size:13px;color:var(--muted)}.scorebar{text-align:center;margin:0 0 16px;color:var(--muted);font-size:14px}.scorebar b{font-size:18px;color:var(--text)}.stage{background:#101827;border-radius:22px;padding:14px;box-shadow:0 15px 40px #20212426}.stage canvas{display:block;width:100%;height:auto;border-radius:12px}.hint{text-align:center;color:var(--muted);font-size:13px;margin:16px 0}.touch{display:flex;justify-content:center;gap:9px}.touch button{min-width:55px}footer{text-align:center;color:#9aa0a6;font-size:13px;padding:20px}@media(max-width:780px){main{padding-top:42px}.games{grid-template-columns:1fr}.art{height:150px}.game-head{gap:8px}.game-head .back,.game-head .restart{padding:8px}.stage{padding:8px}}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#101827aa;border-radius:12px;color:#fff;text-align:center}.overlay h2{margin:0 0 8px;font-size:28px}.overlay p{margin:0 0 16px}.overlay button{margin:0 4px;background:#fff;color:#202124}
</style></head>
<body><div class="app"><header><button class="brand" onclick="home()"><span class="logo">✦</span>Game House</button><button class="sound" id="sound" onclick="toggleSound()">🔊 Sound on</button></header><main>
<section id="home-view"><div class="hero"><div class="eyebrow">Play something fun</div><h1>Game House</h1></div><div class="games"><article class="card"><div class="art pong"><span class="art-icon">🏓</span></div><h2>Pong</h2><p>A smooth head-to-head classic with responsive, modern controls.</p><button class="play" onclick="start('pong')">Play Pong</button></article><article class="card"><div class="art snake"><span class="art-icon">🐍</span></div><h2>Snake</h2><p>Google-inspired grid movement, snappy turns, and a clean new look.</p><button class="play" onclick="start('snake')">Play Snake</button></article><article class="card"><div class="art chess"><span class="art-icon">♞</span></div><h2>Chess</h2><p>A calm, polished board for a quick local match.</p><button class="play" onclick="start('chess')">Play Chess</button></article></div></section>
<section id="game-view" class="view-hidden game-wrap"><div class="game-head"><button class="back" onclick="home()">← Games</button><div class="game-title"><h1 id="game-title">Game</h1><span id="game-subtitle"></span></div><button class="restart" onclick="restart()">↻ Restart</button></div><div class="scorebar" id="scorebar"></div><div class="stage" id="stage"></div><div class="hint" id="hint"></div><div class="touch" id="touch"></div></section>
</main><footer>Game House · Made for quick breaks</footer></div>
<script>
let active=null,raf=null,muted=false,audio;const $=id=>document.getElementById(id);function clickSound(){if(muted)return;audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=520;g.gain.setValueAtTime(.04,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.07);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.07)}document.addEventListener('click',e=>{if(e.target.closest('button'))clickSound()});function toggleSound(){muted=!muted;$('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on'}function home(){active=null;if(raf)cancelAnimationFrame(raf);$('home-view').classList.remove('view-hidden');$('game-view').classList.add('view-hidden')}function start(g){active=g;$('home-view').classList.add('view-hidden');$('game-view').classList.remove('view-hidden');restart()}function restart(){if(active==='pong')pong();if(active==='snake')snake();if(active==='chess')chess()}function setup(t,s,h){$('game-title').textContent=t;$('game-subtitle').textContent=s;$('hint').textContent=h;$('touch').innerHTML='';$('scorebar').innerHTML=''}
function pong(){setup('Pong','First to 7','Move with W/S or ↑/↓ · Each point starts after a 3 second countdown');$('scorebar').innerHTML='<span>You <b id="ps">0</b></span> · <span>Computer <b id="as">0</b></span>';const c=document.createElement('canvas');c.width=700;c.height=420;$('stage').replaceChildren(c);const q=c.getContext('2d');let p={y:180,ay:180,x:350,yb:210,vx:5,vy:3},you=0,ai=0,keys={},phase='countdown',countdown=3,nextRound=performance.now()+3000,ended=false;const move=d=>p.y=Math.max(12,Math.min(300,p.y+d));$('touch').innerHTML='<button>▲</button><button>▼</button>';const bs=$('touch').children;bs[0].onpointerdown=()=>move(-30);bs[1].onpointerdown=()=>move(30);window.onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()};window.onkeyup=e=>delete keys[e.key.toLowerCase()];function resetBall(){p={y:180,ay:180,x:350,yb:210,vx:Math.random()<.5?5:-5,vy:3};phase='countdown';countdown=3;nextRound=performance.now()+3000}function finish(winner){ended=true;phase='ended';$('hint').textContent=winner+' wins!';const o=document.createElement('div');o.className='overlay';o.innerHTML='<div><h2>'+winner+' wins!</h2><p>Final score: '+you+' – '+ai+'</p><button id="again">Restart</button><button id="leave">Leave</button></div>';$('stage').append(o);$('again').onclick=()=>restart();$('leave').onclick=()=>home()}function loop(t){if(active!=='pong'||ended)return;if(phase==='countdown'&&t>=nextRound){phase='playing';countdown=0}if(phase==='playing'){if(keys.w||keys.arrowup)move(-4);if(keys.s||keys.arrowdown)move(4);p.ay+=(p.yb-p.ay)*.04;p.x+=p.vx;p.yb+=p.vy;if(p.yb<8||p.yb>412)p.vy*=-1;if(p.x<38&&p.yb>p.y-8&&p.yb<p.y+108){p.vx=Math.abs(p.vx)*1.02;p.vy+=(p.yb-p.y-54)*.02}if(p.x>662&&p.yb>p.ay-8&&p.yb<p.ay+108)p.vx=-Math.abs(p.vx)*1.02;if(p.x<0){ai++;$('as').textContent=ai;if(ai>=7){finish('Computer');return}resetBall()}if(p.x>700){you++;$('ps').textContent=you;if(you>=7){finish('You');return}resetBall()}}q.fillStyle='#111827';q.fillRect(0,0,700,420);q.setLineDash([8,12]);q.strokeStyle='#ffffff2c';q.beginPath();q.moveTo(350,0);q.lineTo(350,420);q.stroke();q.setLineDash([]);q.fillStyle='#8ab4f8';q.fillRect(26,p.y,12,108);q.fillStyle='#fbbc04';q.fillRect(662,p.ay,12,108);q.fillStyle='#fff';q.beginPath();q.arc(p.x,p.yb,9,0,7);q.fill();if(phase==='countdown'){countdown=Math.max(1,Math.ceil((nextRound-t)/1000));q.fillStyle='#fff';q.font='bold 64px system-ui';q.textAlign='center';q.fillText(countdown,350,235);$('hint').textContent='Round starts in '+countdown+'…'}raf=requestAnimationFrame(loop)}loop(performance.now())}
function snake(){setup('Snake','Google-style','Arrow keys or WASD · Eat the apple and don’t hit the wall');$('scorebar').innerHTML='Score <b id="ss">0</b>';const c=document.createElement('canvas');c.width=c.height=500;$('stage').replaceChildren(c);const q=c.getContext('2d'),grid=20,s={body:[{x:10,y:10},{x:9,y:10},{x:8,y:10}],d:{x:1,y:0},next:{x:1,y:0},food:{x:15,y:10},score:0};function turn(x,y){if(x!==-s.d.x||y!==-s.d.y)s.next={x,y}}window.onkeydown=e=>{const k=e.key.toLowerCase(),moves={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(moves[k]){turn(...moves[k]);e.preventDefault()}};let last=0;function loop(t){if(active!=='snake')return;if(t-last>105){last=t;s.d=s.next;const h={x:s.body[0].x+s.d.x,y:s.body[0].y+s.d.y};if(h.x<0||h.x>=grid||h.y<0||h.y>=grid||s.body.some(v=>v.x===h.x&&v.y===h.y)){snake();return}s.body.unshift(h);if(h.x===s.food.x&&h.y===s.food.y){s.score++;$('ss').textContent=s.score;do{s.food={x:Math.floor(Math.random()*grid),y:Math.floor(Math.random()*grid)}}while(s.body.some(v=>v.x===s.food.x&&v.y===s.food.y))}else s.body.pop()}q.fillStyle='#eaf7ef';q.fillRect(0,0,500,500);q.fillStyle='#fbbc04';q.beginPath();q.arc(s.food.x*25+12.5,s.food.y*25+12.5,8,0,7);q.fill();s.body.forEach((v,i)=>{q.fillStyle=i?'#34a853':'#188038';q.beginPath();q.roundRect(v.x*25+2,v.y*25+2,21,21,7);q.fill()});raf=requestAnimationFrame(loop)}loop(0)}
function chess(){setup('Chess','Local match','Chess board coming soon');$('stage').innerHTML='<div style="color:#fff;text-align:center;padding:80px 20px;font-size:22px">♞ Chess</div>'}
</script></body></html>
